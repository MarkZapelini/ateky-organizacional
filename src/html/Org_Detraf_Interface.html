<!-- ATEKY / DETRAF 2.0 — interface integrada ao Org_Index (dentro de #detrafPainel); sem segundo login.
     Backend: funções dx* em Dx_Nucleo.gs. Ponto de entrada: window.dtInicializar(token). -->
<div id="dx-root" class="dx-app">
  <header class="dx-top"><div><div class="dx-kicker">ATEKY / GESTÃO OPERACIONAL</div><h1>Gestão <span style="color:#36b3ff">DETRAF</span></h1><p class="dx-sub">Interconexão, operadoras, documentos e acompanhamento financeiro.</p></div>
    <button type="button" id="dxRefresh" class="dx-btn dx-topbtn">↻ Atualizar dados</button></header>
  <div class="dx-splash"><div><span class="dx-accent">CONTROLE • ORGANIZAÇÃO • RESULTADOS</span><h2>Central DETRAF</h2><p>Dashboards e histórico por operadora, com sessão única do Ateky Organizacional.</p></div><span class="dx-mark" aria-hidden="true"></span></div>
  <div class="dx-toolbar"><label>Operadora<select id="dxFiltroOp"><option value="">Todas as operadoras</option></select></label><label>Competência<input id="dxFiltroComp" type="month"></label><button id="dxLimpar" type="button" class="dx-btn">Limpar filtros</button></div>
  <nav id="dxNav" class="dx-nav" aria-label="Áreas DETRAF">
    <button type="button" class="dx-btn active" data-dx-page="central">◈ Central DETRAF</button>
    <button type="button" class="dx-btn" data-dx-page="dashboard">▣ Dashboard</button>
    <button type="button" class="dx-btn" data-dx-page="competencias">▦ Competências</button>
    <button type="button" class="dx-btn" data-dx-page="documentos">▤ Documentos</button>
    <button type="button" class="dx-btn" data-dx-page="conciliacoes">⇄ Conciliações</button>
    <button type="button" class="dx-btn" data-dx-page="financeiro">◷ Financeiro</button>
    <button type="button" class="dx-btn" data-dx-page="contestacoes">⚑ Contestações</button>
    <button type="button" class="dx-btn" data-dx-page="pendencias">◉ Pendências</button>
    <button type="button" class="dx-btn" data-dx-page="operadoras">▥ Gestão de OPs</button>
    <button type="button" class="dx-btn" data-dx-page="historico">↺ Histórico</button>
  </nav>
  <div id="dxFeedback" class="dx-feedback" role="status" aria-live="polite"></div>
  <div id="dxPanel"></div>
  <div id="dxModalHost"></div>
</div>
<script>
(function(){
'use strict';
let sessao='',dados=null,pagina='central',opDetalhe='',abaDetalhe='resumo',pesquisa='',iniciado=false,carregando=false;
const el=id=>document.getElementById(id);
const cel=(tag,classe,texto)=>{const n=document.createElement(tag);if(classe)n.className=classe;if(texto!==undefined)n.textContent=String(texto);return n;};
const limpa=n=>n.replaceChildren();
const msg=(s,erro=false)=>{const v=el('dxFeedback');if(v){v.textContent=s||'';v.style.color=erro?'#ffb6bf':'#a6dfff';}};
function api(nome,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[nome](...args));}
function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function compFmt(c){const s=String(c||'');return /^\d{4}-\d{2}$/.test(s)?s.slice(5)+'/'+s.slice(0,4):s;}
const positivo=v=>v===true||v==='true';
function opNome(id){const o=(dados?.operadoras||[]).find(x=>x.id===id);return o?(o.sigla||o.nome):'Operadora indisponível';}
function fOp(){return el('dxFiltroOp')?.value||'';}
function fComp(){return el('dxFiltroComp')?.value||'';}
function filtrados(lista){return (lista||[]).filter(r=>(!fOp()||(r.operadora_id||r.operadora)===fOp())&&(!fComp()||r.competencia===fComp()));}
function botao(texto,acao,principal=false){const b=cel('button','dx-btn'+(principal?' dx-primary':''),texto);b.type='button';b.addEventListener('click',acao);return b;}
function section(titulo,sub,acoes){const r=cel('div','dx-sectionbar');const a=cel('div');a.append(cel('h2','',titulo));if(sub)a.append(cel('p','',sub));r.append(a);if(acoes)r.append(acoes);return r;}
function painel(titulo){const p=cel('section','dx-panel');if(titulo)p.append(cel('h3','',titulo));return p;}
function aviso(texto){return cel('div','dx-warning',texto);}
function vazio(texto){return cel('div','dx-empty',texto||'Nenhum registro encontrado para os filtros selecionados.');}
function kpis(arr){const r=cel('div','dx-stats');arr.forEach(([label,valor])=>{const c=cel('div','dx-stat');c.append(cel('span','',label),cel('strong','',valor));r.append(c);});return r;}
function table(headers,registros,render){if(!registros.length)return vazio();const wrap=cel('div','dx-tablewrap'),t=cel('table'),h=cel('thead'),tr=cel('tr');headers.forEach(v=>tr.append(cel('th','',v)));h.append(tr);t.append(h);const body=cel('tbody');registros.forEach(r=>{const tr=cel('tr');render(r).forEach(col=>{const td=cel('td');if(col instanceof Node)td.append(col);else td.textContent=String(col??'—');tr.append(td);});body.append(tr);});t.append(body);wrap.append(t);return wrap;}
function linkDoc(r){const id=String(r.drive_id||'');if(!/^[A-Za-z0-9_-]{15,}$/.test(id))return 'Arquivo sem link';const a=cel('a','', 'Abrir no Drive');a.target='_blank';a.rel='noopener noreferrer';a.href='https://drive.google.com/file/d/'+id+'/view';return a;}
function infoLimites(chave){const o=dados?.limites?.[chave];return o?.limitado?aviso('Exibindo os registros mais recentes. Há '+o.total+' registros em '+chave+'. Esta versão de testes limita o carregamento inicial para proteger o desempenho.'):null;}
function atualizarOpcoes(){const combo=el('dxFiltroOp'),anterior=combo.value;limpa(combo);combo.append(new Option('Todas as operadoras',''));(dados.operadoras||[]).forEach(o=>combo.append(new Option((o.sigla?o.sigla+' • ':'')+o.nome,o.id)));combo.value=anterior;}
async function carregar(){if(carregando)return;carregando=true;el('dxRefresh').disabled=true;msg('Carregando registros do DETRAF...');try{dados=await api('dxCarregar',sessao);atualizarOpcoes();render();msg('Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));}catch(e){msg(e.message||String(e),true);el('dxPanel').replaceChildren(aviso('Não foi possível carregar: '+(e.message||e)));throw e;}finally{carregando=false;el('dxRefresh').disabled=false;}}
function mudarPagina(p){pagina=p;opDetalhe='';el('dxNav').querySelectorAll('[data-dx-page]').forEach(b=>b.classList.toggle('active',b.dataset.dxPage===p));render();}
function render(){if(!dados)return;const destino=el('dxPanel');limpa(destino);if(opDetalhe){renderDetalhe(destino);return;}switch(pagina){case 'central':central(destino);break;case 'dashboard':dashboard(destino);break;case 'operadoras':operadoras(destino);break;case 'documentos':documentos(destino);break;case 'historico':historico(destino);break;default:registros(destino,pagina);}}
function opsBuscadas(){const q=pesquisa.toLowerCase().trim();return (dados.operadoras||[]).filter(op=>{
 const nome=[op.nome,op.sigla,op.codigos,op.tipo].join(' ').toLowerCase();return (!fOp()||op.id===fOp())&&(!q||nome.includes(q));
});}
function buscaOP(){const campo=cel('input');campo.id='dxBuscaOP';campo.type='search';campo.placeholder='Pesquisar OP, sigla ou código DETRAF...';campo.value=pesquisa;campo.style.maxWidth='370px';campo.addEventListener('input',()=>{pesquisa=campo.value;const bloc=el('dxListaOP');if(bloc){limpa(bloc);if(pagina==='operadoras')montarTabelaOP(bloc);else montarCards(bloc);}});return campo;}
function montarCards(container){const lista=opsBuscadas().filter(o=>positivo(o.ativo));if(!lista.length){container.append(vazio('Nenhuma operadora ativa encontrada. Cadastre uma OP em Gestão de OPs.'));return;}const g=cel('div','dx-ops');lista.forEach(o=>{const b=cel('button','dx-opcard');b.type='button';b.append(cel('span','dx-opicon','◈'),cel('strong','',o.nome),cel('small','',[(o.tipo||'Parceira'),o.sigla||'',o.codigos?'Código(s): '+o.codigos:''].filter(Boolean).join(' • ')),cel('em','','Abrir dashboard →'));b.addEventListener('click',()=>{opDetalhe=o.id;abaDetalhe='resumo';render();});g.append(b);});container.append(g);}
function central(destino){destino.append(section('Selecione uma operadora','Acesse o painel, documentos e histórico individual de cada OP.',buscaOP()));const s=cel('div');s.id='dxListaOP';montarCards(s);destino.append(s);}
function dashboard(destino){
 destino.append(section('Dashboard geral','Posição operacional calculada a partir dos lançamentos cadastrados. Clique em um indicador para abrir a área.'));
 const fin=filtrados(dados.financeiro),pen=filtrados(dados.pendencias),cts=filtrados(dados.contestacoes),cc=filtrados(dados.conciliacoes),docs=filtrados(dados.documentos);
 const aberto=fin.filter(r=>r.status==='PENDENTE'),soma=t=>aberto.filter(r=>r.natureza===t).reduce((n,r)=>n+Number(r.valor||0),0);
 const pagar=soma('PAGAR'),receber=soma('RECEBER'),saldo=receber-pagar;
 const penAb=pen.filter(r=>r.status!=='RESOLVIDA'),ctsAb=cts.filter(r=>!['ENCERRADA','RETIFICADA'].includes(r.status));
 const hoje=new Date().toISOString().slice(0,10);
 const vencidos=aberto.filter(r=>r.vencimento&&String(r.vencimento).slice(0,10)<hoje);
 const inteiro=n=>String(Math.round(n));
 // Indicadores principais
 const kp=cel('div','dx-kpis');
 [
  {k:'pagar',ic:'↗',label:'A pagar (pendente)',valor:pagar,fmt:moeda,sub:aberto.filter(r=>r.natureza==='PAGAR').length+' lançamento(s) em aberto',ir:'financeiro'},
  {k:'receber',ic:'↙',label:'A receber (pendente)',valor:receber,fmt:moeda,sub:aberto.filter(r=>r.natureza==='RECEBER').length+' lançamento(s) em aberto',ir:'financeiro'},
  {k:'saldo'+(saldo<0?' neg':''),ic:'⚖',label:'Saldo previsto',valor:saldo,fmt:moeda,sub:saldo>=0?'A receber supera a pagar':'A pagar supera a receber',ir:'financeiro'},
  {k:'pend'+(vencidos.length?' alerta':''),ic:'◉',label:'Pendências abertas',valor:penAb.length,fmt:inteiro,sub:vencidos.length?'⚠ '+vencidos.length+' vencimento(s) em atraso':'Nenhum vencimento em atraso',ir:'pendencias'}
 ].forEach((c,i)=>{
  const b=cel('button','dx-kpi dx-kpi-'+c.k);b.type='button';b.style.setProperty('--i',i);
  const top=cel('div','dx-kpi-top');top.append(cel('span','dx-kpi-ic',c.ic),cel('span','dx-kpi-label',c.label));
  const v=cel('strong','dx-kpi-val',c.fmt(0));contar(v,c.valor,c.fmt);
  b.append(top,v,cel('small','dx-kpi-sub',c.sub),cel('em','dx-kpi-go','Ver detalhes →'));
  b.addEventListener('click',()=>mudarPagina(c.ir));kp.append(b);
 });
 destino.append(kp);
 // Indicadores secundários
 const mini=cel('div','dx-minis');
 [['▤','Documentos',docs.length,'documentos'],['◔','Aguardando leitura',docs.filter(x=>x.status==='AGUARDANDO_LEITURA').length,'documentos'],['⇄','Conciliações',cc.length,'conciliacoes'],['⚑','Contestações em aberto',ctsAb.length,'contestacoes'],['▥','Operadoras ativas',(dados.operadoras||[]).filter(x=>positivo(x.ativo)).length,'operadoras']]
  .forEach(([ic,l,n,ir],i)=>{const b=cel('button','dx-mini');b.type='button';b.style.setProperty('--i',i);const v=cel('strong','','0');contar(v,n,inteiro);b.append(cel('span','dx-mini-ic',ic),v,cel('span','dx-mini-l',l));b.addEventListener('click',()=>mudarPagina(ir));mini.append(b);});
 destino.append(mini);
 // Gráfico + vencimentos
 const grid=cel('div','dx-dashgrid');grid.append(graficoFinanceiro(fin),proximosVencimentos(aberto,hoje));destino.append(grid);
 // Documentação por operadora
 const s=painel('Documentação por operadora');const bars=cel('div','dx-bars'),ds=docs;const ops=(dados.operadoras||[]).filter(op=>!fOp()||op.id===fOp());const counts=ops.map(op=>({op,count:ds.filter(d=>d.operadora===op.id).length})).sort((a,b)=>b.count-a.count);const max=Math.max(1,...counts.map(x=>x.count));
 counts.forEach(x=>{const row=cel('div','dx-barrow');row.title=(x.op.sigla||x.op.nome)+': '+x.count+' documento(s)';row.append(cel('span','',x.op.sigla||x.op.nome));const track=cel('div','dx-track'),bar=cel('div','dx-fill');bar.style.width=(100*x.count/max)+'%';track.append(bar);row.append(track,cel('strong','',x.count));bars.append(row);});
 s.append(counts.length?bars:vazio());destino.append(s);
 destino.append(aviso('Valores são lançamentos manuais registrados; documentos aguardando leitura não alimentam os indicadores automaticamente.'));
}
function contar(alvo,valor,fmt){
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){alvo.textContent=fmt(valor);return;}
 const t0=performance.now(),dur=900;const passo=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);alvo.textContent=fmt(valor*e);if(p<1)requestAnimationFrame(passo);};requestAnimationFrame(passo);
}
function moedaCurta(v){const n=Number(v||0);return n>=1e6?'R$ '+(n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':n>=1e3?'R$ '+(n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':'R$ '+n.toLocaleString('pt-BR',{maximumFractionDigits:0});}
function graficoFinanceiro(fin){
 const p=painel();const head=cel('div','dx-chart-head');const t=cel('div');t.append(cel('h3','','Financeiro por competência'),cel('p','dx-muted','Valores lançados (exceto estornados) — últimas 6 competências.'));
 const leg=cel('div','dx-legend');[['pagar','A pagar'],['receber','A receber']].forEach(([k,l])=>{const it=cel('span','dx-leg');it.append(cel('i','dx-sw dx-sw-'+k),document.createTextNode(l));leg.append(it);});
 head.append(t,leg);p.append(head);
 const comps=[...new Set(fin.map(r=>r.competencia).filter(Boolean))].sort().slice(-6);
 if(!comps.length){p.append(vazio('Sem lançamentos financeiros para os filtros selecionados.'));return p;}
 const tot=(c,n)=>fin.filter(r=>r.competencia===c&&r.natureza===n&&r.status!=='ESTORNADO').reduce((s,r)=>s+Number(r.valor||0),0);
 const serie=comps.map(c=>({c,pagar:tot(c,'PAGAR'),receber:tot(c,'RECEBER')}));
 const max=Math.max(1,...serie.flatMap(x=>[x.pagar,x.receber]));
 const area=cel('div','dx-chart');const eixo=cel('div','dx-yaxis');[max,max/2,0].forEach(v=>eixo.append(cel('span','',moedaCurta(v))));
 const plot=cel('div','dx-plot');const tip=cel('div','dx-tip');tip.hidden=true;
 serie.forEach((x,i)=>{
  const col=cel('div','dx-col');col.tabIndex=0;col.setAttribute('aria-label',compFmt(x.c)+': a pagar '+moeda(x.pagar)+', a receber '+moeda(x.receber));
  const par=cel('div','dx-pair');[['pagar',x.pagar],['receber',x.receber]].forEach(([k,v])=>{const b=cel('div','dx-bar dx-bar-'+k);b.style.height=(v/max*100)+'%';b.style.setProperty('--i',i);par.append(b);});
  col.append(par,cel('span','dx-xlab',compFmt(x.c)));
  const mostrar=()=>{tip.replaceChildren(cel('strong','',compFmt(x.c)));[['pagar','A pagar',x.pagar],['receber','A receber',x.receber]].forEach(([k,l,v])=>{const r=cel('div','dx-tip-row');r.append(cel('i','dx-sw dx-sw-'+k),cel('span','',l),cel('b','',moeda(v)));tip.append(r);});
   const s=cel('div','dx-tip-row dx-tip-saldo');s.append(cel('span','','Saldo'),cel('b','',moeda(x.receber-x.pagar)));tip.append(s);
   tip.hidden=false;const pr=plot.getBoundingClientRect(),cr=col.getBoundingClientRect();tip.style.left=Math.min(pr.width-170,Math.max(0,cr.left-pr.left+cr.width/2-85))+'px';col.classList.add('on');};
  const ocultar=()=>{tip.hidden=true;col.classList.remove('on');};
  col.addEventListener('mouseenter',mostrar);col.addEventListener('focus',mostrar);col.addEventListener('mouseleave',ocultar);col.addEventListener('blur',ocultar);
  plot.append(col);
 });
 plot.append(tip);area.append(eixo,plot);p.append(area);
 // Visão em tabela (acessibilidade)
 const tg=botao('Ver tabela',()=>{tw.hidden=!tw.hidden;tg.textContent=tw.hidden?'Ver tabela':'Ocultar tabela';});tg.classList.add('dx-small');
 const tw=cel('div');tw.hidden=true;tw.append(table(['Competência','A pagar','A receber','Saldo'],serie,x=>[compFmt(x.c),moeda(x.pagar),moeda(x.receber),moeda(x.receber-x.pagar)]));
 p.append(tg,tw);return p;
}
function proximosVencimentos(aberto,hoje){
 const p=painel('Próximos vencimentos');
 const lista=aberto.filter(r=>r.vencimento).sort((a,b)=>String(a.vencimento).localeCompare(String(b.vencimento))).slice(0,6);
 if(!lista.length){p.append(vazio('Nenhum lançamento pendente com vencimento definido.'));return p;}
 const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
 const ul=cel('div','dx-venc');
 lista.forEach((r,i)=>{
  const d=String(r.vencimento).slice(0,10),dias=Math.round((Date.parse(d)-Date.parse(hoje))/864e5),atras=dias<0;
  const row=cel('button','dx-venc-row'+(atras?' atrasado':'')+(dias===0?' hoje':''));row.type='button';row.style.setProperty('--i',i);
  const data=cel('div','dx-venc-data');data.append(cel('strong','',d.slice(8,10)),cel('span','',meses[Number(d.slice(5,7))-1]||''));
  const info=cel('div','dx-venc-info');info.append(cel('strong','',r.descricao||(r.natureza==='PAGAR'?'Pagamento':'Recebimento')),cel('small','',opNome(r.operadora_id)+' · '+compFmt(r.competencia)));
  const val=cel('div','dx-venc-val');const v=cel('strong','');v.append(cel('i','dx-sw dx-sw-'+(r.natureza==='PAGAR'?'pagar':'receber')),document.createTextNode(moeda(r.valor)));
  val.append(v,cel('small',atras?'dx-atraso':'',atras?'Atrasado há '+(-dias)+' dia(s)':dias===0?'Vence hoje':'Em '+dias+' dia(s)'));
  row.append(data,info,val);row.title='Editar lançamento';row.addEventListener('click',()=>abrirForm('financeiro',r));ul.append(row);
 });
 p.append(ul);return p;
}
function operadoras(destino){const a=cel('div','dx-row');a.append(buscaOP());if(dados.admin)a.append(botao('+ Nova operadora',()=>abrirForm('operadoras'),true));destino.append(section('Gestão de operadoras','Cadastro de siglas, códigos DETRAF e regras de encontro de contas.',a));
 const s=painel('Operadoras cadastradas'),list=cel('div');list.id='dxListaOP';montarTabelaOP(list);s.append(list);destino.append(s);const warn=infoLimites('operadoras');if(warn)destino.append(warn);}
function montarTabelaOP(list){const filtr=opsBuscadas();list.append(table(['Operadora','Sigla','Tipo','Código(s) DETRAF','Encontro de contas','Situação','Ações'],filtr,o=>{
 const acoes=cel('div','dx-actions');acoes.append(botao('Painel',()=>{opDetalhe=o.id;render();}));if(dados.admin){acoes.append(botao('Editar',()=>abrirForm('operadoras',o)),botao(positivo(o.ativo)?'Desativar':'Reativar',async()=>{
 const razao=window.prompt('Motivo para alterar o status da OP:');if(razao===null)return;try{await api('dxAtivarOperadora',sessao,o.id,!positivo(o.ativo),razao);await carregar();msg('Operadora atualizada.');}catch(e){msg(e.message,true);}
 }));}return [o.nome,o.sigla||'',o.tipo||'',o.codigos||'—',o.encontro_regra||String(o.encontro_contas),positivo(o.ativo)?'Ativa':'Inativa',acoes];}));}
function docsTabela(arr){return table(['Competência','Operadora','Documento','Tipo','Status','Data','Arquivo'],arr,r=>[compFmt(r.competencia),opNome(r.operadora),r.nome_original,r.tipo,r.status,String(r.criado_em||'').slice(0,10),linkDoc(r)]);}
function documentos(destino){const b=cel('div','dx-row');b.append(botao('Enviar arquivos',()=>formUpload(),true));destino.append(section('Central de documentos','Uploads por operadora, competência, tipo e histórico de envio.',b));
 const s=painel('Documentos cadastrados');s.append(docsTabela(filtrados(dados.documentos)));destino.append(s);destino.append(aviso('Arquivos originais: Google Drive → Operadora → Ano → Mês → Tipo. Formatos XLS, XLSX, CSV, TXT, PDF e XML até 8 MB. A leitura automática ainda depende da validação dos modelos.'));
 const warn=infoLimites('documentos');if(warn)destino.append(warn);}
const ESQUEMAS={
 operadoras:{titulo:'Operadora',campos:[['nome','Nome da operadora','text'],['sigla','Sigla','text'],['tipo','Tipo','select',['Parceira','Propria']],['codigos','Códigos DETRAF (separados por vírgula)','text'],['encontro_regra','Encontro de contas','select',['Obrigatorio','Opcional','Nao realizado']],['observacoes','Observações','textarea'],['motivo','Motivo da alteração','text']]},
 competencias:{titulo:'Competência',campos:[['operadora_id','Operadora','operadora'],['competencia','Competência','month'],['status','Situação','select',['EM_CONFERENCIA','PENDENTE','AGUARDANDO_OPERADORA','CONCLUIDA']],['proxima_acao','Próxima ação','text'],['prazo','Prazo','date'],['responsavel','Responsável','text'],['observacao','Observações','textarea'],['motivo_alteracao','Motivo da alteração','text']]},
 conciliacoes:{titulo:'Conciliação',campos:[['operadora_id','Operadora','operadora'],['competencia','Competência','month'],['valor_enviado','Valor enviado','number'],['valor_recebido','Valor recebido','number'],['valor_acordado','Valor acordado','number'],['status','Status','select',['EM_CONFERENCIA','DIVERGENTE','ACORDADO','CONCLUIDO']],['observacao','Observações','textarea'],['motivo_alteracao','Motivo da alteração','text']]},

function registros(destino,tipo){const es=ESQUEMAS[tipo];if(!es){destino.append(aviso('Área não disponível.'));return;}const a=cel('div','dx-row');a.append(botao('+ Novo registro',()=>abrirForm(tipo),true));destino.append(section(es.titulo+'s','Registros vinculados à operadora e à competência, com auditoria por campo.',a));
 const reg=filtrados(dados[tipo]||[]),s=painel('Registros');let cols,render;
 const editar=r=>botao('Editar',()=>abrirForm(tipo,r));
 if(tipo==='competencias'){cols=['Competência','OP','Situação','Próxima ação','Prazo','Responsável','Editar'];render=r=>[compFmt(r.competencia),opNome(r.operadora_id),r.status,r.proxima_acao,r.prazo,r.responsavel,editar(r)];}
 if(tipo==='conciliacoes'){cols=['Competência','OP','Enviado','Recebido','Acordado','Diferença','Status','Editar'];render=r=>[compFmt(r.competencia),opNome(r.operadora_id),moeda(r.valor_enviado),moeda(r.valor_recebido),moeda(r.valor_acordado),moeda(r.diferenca),r.status,editar(r)];}
 if(tipo==='financeiro'){cols=['Competência','OP','Natureza','Valor','Status','Vencimento','Baixa','Editar'];render=r=>[compFmt(r.competencia),opNome(r.operadora_id),r.natureza,moeda(r.valor),r.status,r.vencimento,r.data_baixa,editar(r)];}
 if(tipo==='contestacoes'){cols=['Competência','OP','Motivo','Valor','Retenção','Status','CDR enviado','Retificação','Editar'];render=r=>[compFmt(r.competencia),opNome(r.operadora_id),r.motivo,moeda(r.valor_contestado),r.tipo_retencao||'',r.status,positivo(r.cdr_enviado)?'Sim':'Não',positivo(r.retificacao_confirmada)?'Confirmada':'Pendente',editar(r)];}
 if(tipo==='pendencias'){cols=['Competência','OP','Descrição','Responsável','Prazo','Status','Resolução','Editar'];render=r=>[compFmt(r.competencia),opNome(r.operadora_id),r.descricao,r.responsavel,r.prazo,r.status,r.resolucao,editar(r)];}
 s.append(table(cols,reg,render));destino.append(s);const warn=infoLimites(tipo);if(warn)destino.append(warn);
}
function historico(destino){destino.append(section('Histórico de alterações','Cada campo modificado é registrado com autor, data, valor anterior e novo valor.'));
 const a=painel('Alterações detalhadas');const lista=(dados.historico||[]).filter(r=>!fOp()||r.operadora_id===fOp()).filter(r=>!fComp()||r.competencia===fComp());
 a.append(table(['Data e hora','Usuário','Entidade','Ação','Campo','Antes','Depois','Motivo'],lista,r=>[String(r.data_hora||'').replace('T',' ').slice(0,19),r.usuario_nome||r.usuario_login,r.entidade,r.acao,r.campo,r.antes,r.depois,r.motivo]));destino.append(a);
 const b=painel('Auditoria técnica');b.append(table(['Data','Usuário','Ação','Referência','Detalhes'],(dados.auditoria||[]).slice(0,100),r=>[r.data_hora,r.usuario,r.acao,r.referencia,r.detalhe]));destino.append(b);const warn=infoLimites('historico');if(warn)destino.append(warn);}
function opRegistros(tipo,op){return (dados[tipo]||[]).filter(r=>(r.operadora_id||r.operadora)===op.id).filter(r=>!fComp()||r.competencia===fComp());}
function renderDetalhe(destino){const op=(dados.operadoras||[]).find(o=>o.id===opDetalhe);if(!op){opDetalhe='';render();return;}
 const voltar=cel('button','dx-crumb','← Voltar à Central DETRAF');voltar.addEventListener('click',()=>{opDetalhe='';render();});destino.append(voltar);
 destino.append(section(op.nome,[(op.sigla||''),(op.codigos?'Código(s) DETRAF: '+op.codigos:''),(op.encontro_regra||'')].filter(Boolean).join(' • ')));
 const wrap=painel();wrap.classList.add('dx-opdetail');const tabs=cel('div','dx-tabs');[['resumo','Visão geral'],['competencias','Competências'],['documentos','Documentos'],['financeiro','Financeiro'],['conciliacoes','Conciliações'],['contestacoes','Contestações'],['pendencias','Pendências'],['historico','Histórico']].forEach(([key,label])=>{
 const b=botao(label,()=>{abaDetalhe=key;renderDetalheSoConteudo(op);});b.classList.toggle('active',abaDetalhe===key);b.dataset.dxTab=key;tabs.append(b);});wrap.append(tabs);
 const bloco=cel('div');bloco.id='dxDetailBody';wrap.append(bloco);destino.append(wrap);renderDetalheSoConteudo(op);}
function renderDetalheSoConteudo(op){el('dxPanel').querySelectorAll('[data-dx-tab]').forEach(b=>b.classList.toggle('active',b.dataset.dxTab===abaDetalhe));const alvo=el('dxDetailBody');limpa(alvo);
 if(abaDetalhe==='resumo'){const docs=opRegistros('documentos',op),pen=opRegistros('pendencias',op),fin=opRegistros('financeiro',op);const soma=t=>fin.filter(x=>x.status==='PENDENTE'&&x.natureza===t).reduce((n,x)=>n+Number(x.valor||0),0);
 alvo.append(kpis([['Documentos',docs.length],['A pagar',moeda(soma('PAGAR'))],['A receber',moeda(soma('RECEBER'))],['Pendências abertas',pen.filter(x=>x.status!=='RESOLVIDA').length]]));alvo.append(aviso('Dados financeiros lançados manualmente; nenhum pagamento é criado a partir dos arquivos enviados.'));return;}
 if(abaDetalhe==='historico'){const lista=(dados.historico||[]).filter(x=>x.operadora_id===op.id).filter(x=>!fComp()||x.competencia===fComp());alvo.append(table(['Quando','Quem','Entidade','Campo','Antes','Depois'],lista,x=>[x.data_hora,x.usuario_nome,x.entidade,x.campo,x.antes,x.depois]));return;}
 if(abaDetalhe==='documentos'){const a=botao('Enviar documentos desta OP',()=>formUpload(op),true);alvo.append(a,docsTabela(opRegistros('documentos',op)));return;}
 const typ=abaDetalhe;if(!ESQUEMAS[typ])return;
 alvo.append(botao('+ Novo registro',()=>abrirForm(typ,{operadora_id:op.id,competencia:fComp()}),true));
 const reg=opRegistros(typ,op);alvo.append(table(['Competência','Situação / Natureza','Valor / Descrição','Ação'],reg,x=>[compFmt(x.competencia),x.status||x.natureza||'',x.valor!==undefined?moeda(x.valor):x.descricao||x.motivo||x.proxima_acao||x.observacao||'',botao('Editar',()=>abrirForm(typ,x))]));}
function fecharModal(){limpa(el('dxModalHost'));}
function campoForm(id,rotulo,tipo,options,valor){const field=cel('label','dx-field');if(tipo==='textarea')field.classList.add('wide');field.append(cel('span','',rotulo));let input;
 if(tipo==='select'||tipo==='operadora'){input=cel('select');const opts=tipo==='operadora'?(dados.operadoras||[]).map(o=>[o.id,(o.sigla||o.nome)+' — '+o.nome]):options.map(x=>[x,x]);if(tipo==='operadora')input.append(new Option('Selecione a operadora',''));opts.forEach(([v,label])=>input.append(new Option(label,v)));}
 else if(tipo==='textarea'){input=cel('textarea');input.rows=3;}
 else {input=cel('input');input.type=tipo==='checkbox'?'checkbox':tipo==='number'?'number':tipo==='month'?'month':tipo==='date'?'date':'text';if(tipo==='number'){input.min='0';input.step='0.01';}}
 input.name=id;if(tipo==='checkbox')input.checked=positivo(valor);else if(valor!==null&&valor!==undefined)input.value=String(valor);
 field.append(input);return field;}
function abrirForm(tipo,registro){const es=ESQUEMAS[tipo];if(!es)return;registro=registro||{};
 const host=el('dxModalHost');limpa(host);const overlay=cel('div','dx-overlay'),modal=cel('div','dx-modal');const topo=cel('div','dx-sectionbar');topo.append(cel('h2','',(registro.id?'Editar ':'Nova ')+es.titulo),botao('✕ Fechar',fecharModal));modal.append(topo);
 const form=cel('form');const campos=cel('div','dx-fields');es.campos.forEach(c=>{const value=registro[c[0]]!==undefined?registro[c[0]]:c[0]==='operadora_id'?fOp():c[0]==='competencia'?fComp():undefined;campos.append(campoForm(c[0],c[1],c[2],c[3]||[],value));});form.append(campos);const status=cel('p','dx-feedback');const enviar=cel('button','dx-btn dx-primary',registro.id?'Salvar alterações':'Cadastrar');enviar.type='submit';form.append(enviar,status);
 form.addEventListener('submit',async e=>{e.preventDefault();enviar.disabled=true;status.textContent='Salvando...';const obj={...registro};for(const campo of es.campos){const input=form.elements.namedItem(campo[0]);obj[campo[0]]=campo[2]==='checkbox'?input.checked:input.value;}
 try{if(tipo==='operadoras')await api('dxSalvarOperadora',sessao,obj);else await api('dxSalvarRegistro',sessao,tipo,obj);fecharModal();await carregar();msg('Registro salvo, com histórico de alterações.');}catch(err){status.textContent=err.message||String(err);status.style.color='#ffbcc8';}finally{enviar.disabled=false;}});modal.append(form);overlay.append(modal);overlay.addEventListener('click',e=>{if(e.target===overlay)fecharModal();});host.append(overlay);}
async function base64Arquivo(file){return new Promise((resolve,reject)=>{const leitor=new FileReader();leitor.onload=()=>resolve(String(leitor.result).split(',')[1]);leitor.onerror=()=>reject(Error('Não foi possível ler o arquivo.'));leitor.readAsDataURL(file);});}
function formUpload(op){const host=el('dxModalHost');limpa(host);const overlay=cel('div','dx-overlay'),modal=cel('div','dx-modal');const top=cel('div','dx-sectionbar');top.append(cel('h2','','Importar documentos'),botao('✕ Fechar',fecharModal));modal.append(top);
 const form=cel('form'),campos=cel('div','dx-fields');campos.append(campoForm('operadora_id','Operadora','operadora',[],op?.id||fOp()),campoForm('competencia','Competência','month',[],fComp()),campoForm('tipo','Tipo de documento','select',[
  'DETRAF_RECEBIDO','DETRAF_ENVIADO','ENCONTRO_CONTAS','NF_RECEBIDA','NF_ENVIADA','CONTESTACAO','COMPROVANTE','OUTRO'],''));
 const f=campoForm('arquivos','Arquivos (máximo 8 MB cada)','text',[],'');const input=f.querySelector('input');input.type='file';input.accept='.xls,.xlsx,.csv,.txt,.pdf,.xml';input.multiple=true;campos.append(f);form.append(campos,aviso('Documentos serão armazenados no Drive com status AGUARDANDO_LEITURA; não são processados financeiramente automaticamente.'));
 const btn=cel('button','dx-btn dx-primary','Enviar arquivos');btn.type='submit';const estado=cel('p','dx-feedback');form.append(btn,estado);form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;const opid=form.elements.namedItem('operadora_id').value,comp=form.elements.namedItem('competencia').value,tipo=form.elements.namedItem('tipo').value;const fs=Array.from(input.files||[]);let ok=0,erros=[];
 for(const arq of fs){try{if(!arq.size||arq.size>8*1024*1024)throw Error('Limite de 8 MB ou arquivo vazio.');estado.textContent='Enviando '+arq.name+'...';const b=await base64Arquivo(arq);await api('dxEnviarDocumento',sessao,{operadora_id:opid,competencia:comp,tipo,nome:arq.name,base64:b});ok++;}catch(err){erros.push(arq.name+': '+(err.message||err));}}
 estado.textContent=ok+' arquivo(s) importado(s). '+erros.join(' | ');estado.style.color=erros.length?'#ffcad5':'#9be8c2';btn.disabled=false;if(ok){await carregar();}}
 );modal.append(form);overlay.append(modal);overlay.addEventListener('click',e=>{if(e.target===overlay)fecharModal();});host.append(overlay);}
function iniciarEventos(){if(iniciado)return;iniciado=true;el('dxRefresh').addEventListener('click',()=>carregar().catch(()=>{}));el('dxLimpar').addEventListener('click',()=>{el('dxFiltroOp').value='';el('dxFiltroComp').value='';pesquisa='';render();});el('dxFiltroOp').addEventListener('change',render);el('dxFiltroComp').addEventListener('change',render);el('dxNav').addEventListener('click',e=>{const b=e.target.closest('[data-dx-page]');if(b)mudarPagina(b.dataset.dxPage);});}
window.dtInicializar=async function(token){if(typeof token!=='string'||!token)throw Error('Sessão do Organizacional ausente.');sessao=token;iniciarEventos();await carregar();};
})();
